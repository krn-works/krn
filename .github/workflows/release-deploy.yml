name: Test and deploy release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sawaryn-antispam-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        if: github.event_name == 'release'
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(sed -n 's/^ \* Version: //p' antispam-lite.php)"
          test "$actual" = "$expected"
      - name: Run focused contracts
        run: php tests/run.php
      - name: Check PHP syntax
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          ! rg '\bASL_(DIR|VER|TD|LOG_TABLE|KEYWORDS_DIR)\b' --glob '*.php' --glob '!tests/**'
      - name: Build deployment artifact
        run: |
          mkdir -p artifact/lightweight-rekurencja-antyspam
          rsync -a \
            --exclude=.git \
            --exclude=.github \
            --exclude=.vscode \
            --exclude=artifact \
            --exclude=vendor \
            --exclude=tests \
            --exclude=AGENTS.md \
            --exclude=SOURCE.md \
            --exclude=composer.lock \
            --exclude=phpcs.xml \
            ./ artifact/lightweight-rekurencja-antyspam/
          tar -C artifact -czf lightweight-rekurencja-antyspam.tar.gz lightweight-rekurencja-antyspam
      - uses: actions/upload-artifact@v7
        with:
          name: lightweight-rekurencja-antyspam-${{ github.sha }}
          path: lightweight-rekurencja-antyspam.tar.gz
          if-no-files-found: error

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: sawaryn-production
      url: https://sawaryn.com
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: lightweight-rekurencja-antyspam-${{ github.sha }}
      - name: Configure production SSH key
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload verified artifact
        run: |
          scp -P "${{ secrets.PRODUCTION_SSH_PORT }}" \
            lightweight-rekurencja-antyspam.tar.gz \
            "${{ secrets.PRODUCTION_SSH_USER }}@${{ secrets.PRODUCTION_SSH_HOST }}:/tmp/rekurencja-antispam-${{ github.run_id }}.tar.gz"
      - name: Atomically deploy and verify Sawaryn installations
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
          SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          RUN_ID: ${{ github.run_id }}
          EXPECTED_VERSION: ${{ github.event_name == 'release' && github.ref_name || '' }}
        run: |
          expected="${EXPECTED_VERSION#v}"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "RUN_ID='$RUN_ID' EXPECTED_VERSION='$expected' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          archive="/tmp/rekurencja-antispam-${RUN_ID}.tar.gz"
          work="/tmp/rekurencja-antispam-${RUN_ID}"
          backup_root="/var/www/vhosts/sawaryn.com/migration-backups/antispam-plugin-${RUN_ID}"
          plugin_slug="lightweight-rekurencja-antyspam"
          targets=(
            "/var/www/vhosts/sawaryn.com/bedrock/src/web/app/plugins/${plugin_slug}"
            "/var/www/vhosts/sawaryn.com/us.sawaryn.com/bedrock/src/web/app/plugins/${plugin_slug}"
          )
          labels=(primary us)

          mkdir -m 700 "$work" "$backup_root"
          tar -xzf "$archive" -C "$work"
          source_dir="$work/$plugin_slug"
          test -f "$source_dir/antispam-lite.php"
          if [ -z "$EXPECTED_VERSION" ]; then
            EXPECTED_VERSION="$(sed -n 's/^ \* Version: //p' "$source_dir/antispam-lite.php")"
          fi
          find "$source_dir" -name '*.php' -print0 | xargs -0 -n1 /opt/alt/php83/usr/bin/php -l >/dev/null

          swapped=()
          rollback() {
            status=$?
            if (( status == 0 )); then return; fi
            for index in "${swapped[@]}"; do
              target="${targets[$index]}"
              label="${labels[$index]}"
              if [ -d "$target" ]; then mv "$target" "$backup_root/failed-$label"; fi
              if [ -d "$backup_root/$label" ]; then mv "$backup_root/$label" "$target"; fi
            done
            exit "$status"
          }
          trap rollback ERR

          for index in "${!targets[@]}"; do
            target="${targets[$index]}"
            label="${labels[$index]}"
            stage="${target}.new-${RUN_ID}"
            cp -a "$source_dir" "$stage"
            if [ -d "$target" ]; then mv "$target" "$backup_root/$label"; fi
            mv "$stage" "$target"
            swapped+=("$index")
          done

          WP=/usr/local/psa/admin/plib/modules/wp-toolkit/vendor/wp-cli/vendor/wp-cli/wp-cli/bin/wp
          export PATH=/opt/alt/php83/usr/bin:$PATH
          wp_primary() { sh "$WP" --path=/var/www/vhosts/sawaryn.com/bedrock/src/web/wp --require=/var/www/vhosts/sawaryn.com/bedrock/vendor/autoload.php --url=https://sawaryn.com "$@"; }
          wp_us() { sh "$WP" --path=/var/www/vhosts/sawaryn.com/us.sawaryn.com/bedrock/src/web/wp --require=/var/www/vhosts/sawaryn.com/us.sawaryn.com/bedrock/vendor/autoload.php --url=https://us.sawaryn.com "$@"; }

          for runner in wp_primary wp_us; do
            "$runner" plugin activate "$plugin_slug"
            version="$("$runner" plugin get "$plugin_slug" --field=version)"
            test "$version" = "$EXPECTED_VERSION"
            "$runner" eval '$spam=asl_score_text("<a href=https://spam.example/>spam</a>"); $ham=asl_score_text("Hello, I need legal advice about a company agreement."); if ($spam < 70 || $ham >= 30) { exit(1); }'
          done

          curl -fsS -o /dev/null https://sawaryn.com/
          curl -fsS -o /dev/null https://us.sawaryn.com/
          curl -fsS -o /dev/null https://sawaryn.com/en/
          rm -f "$archive"
          printf 'Deployed Rekurencja Antyspam %s to primary and US.\n' "$EXPECTED_VERSION"
          REMOTE
