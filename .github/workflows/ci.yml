name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64","krn-ci-isolated"]') }}
    env:
      KRN_LIVE: ''
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Check isolation test capabilities
        run: |
          set -euo pipefail
          command -v bwrap
          command -v systemctl
          command -v systemd-run
          echo 'Checking bwrap user namespace and mount capabilities'
          bwrap --ro-bind / / --proc /proc --dev /dev /usr/bin/true
          echo 'Checking systemd user manager and transient scope capability'
          systemctl --user show-environment >/dev/null
          systemd-run --user --scope --wait --quiet /usr/bin/true
          echo 'Isolation capability check passed: bwrap and systemd user scope are available'

      - name: Enable pnpm through Corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@12.10.1 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gate
        run: npm run gate
