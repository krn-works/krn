name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  KRN_LIVE: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      test: ${{ steps.detect.outputs.test }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # The runner's own Node runs the dependency-free detector; skipping
      # setup-node keeps this gating job off the critical path.
      # Fail open: pushes to main and any detection problem run everything.
      # A pull request that changes only task records skips tests.
      - name: Detect affected jobs
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          listing="$RUNNER_TEMP/changed-files"
          : > "$listing"
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames "$BASE...$HEAD" > "$listing" 2>/dev/null || : > "$listing"
          fi
          node scripts/ci-changes.mjs "$listing" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up CI
        uses: ./.github/actions/setup-ci

      # Rendered rules and task records are checked by `npm run preflight`
      # before review; CI only verifies the code.
      - name: Biome
        run: npm run lint

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up CI
        uses: ./.github/actions/setup-ci

      - name: Typecheck
        run: npm run check

  test:
    name: Test (${{ matrix.shard }}/8)
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      KRN_TEST_SHARD_INDEX: ${{ matrix.shard }}
      KRN_TEST_SHARD_TOTAL: '8'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up CI
        uses: ./.github/actions/setup-ci
        with:
          isolation: 'true'

      - name: Set up mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.17
          install: false
          cache: false

      - name: Install the pinned package manager with mise
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manager="$(node -p "require('./package.json').packageManager")"
          mise install "$manager"

      - name: Run test shard
        env:
          KRN_TEST_OUTPUT: failures
          KRN_TEST_STRICT: '1'
        run: npm test

  check:
    name: Check
    if: ${{ always() }}
    needs:
      - changes
      - lint
      - typecheck
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed, or be skipped by the change filter
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s' "$RESULTS" | node -e '
            const needs = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            let bad = 0;
            for (const [name, { result }] of Object.entries(needs)) {
              console.log(`${name}: ${result}`);
              const skipOk = name === "test" && result === "skipped" && needs.changes?.outputs?.test === "false";
              if (result !== "success" && !skipOk) bad += 1;
            }
            process.exit(bad ? 1 : 0);
          '
