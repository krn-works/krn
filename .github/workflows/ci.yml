name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile check
        run: |
          python -m py_compile search_tool/*.py .claude/hooks/websearch_krn_search_guard.py

      - name: Whitespace check
        run: git diff --check

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run eval-corpus
        run: |
          python -m search_tool eval-corpus tests/fixtures/search_corpus/basic.json \
            --work-dir "$(mktemp -d)" > /tmp/eval_stdout.json 2> /tmp/eval_stderr.txt
          python -m json.tool /tmp/eval_stdout.json >/dev/null
          cat /tmp/eval_stderr.txt

      - name: Research mode — preflight and error JSON (network-free)
        run: |
          python -m search_tool search-query "test" \
            --research \
            --profile nope \
            --provider static \
            --candidate-url "https://example.com" \
            > /tmp/research_json.json 2>/tmp/research_stderr.txt || true
          python -m json.tool /tmp/research_json.json >/dev/null
          cat /tmp/research_stderr.txt
          python3 - <<'PY'
          import json, pathlib
          data = json.load(open("/tmp/research_json.json"))
          # Error state
          assert data.get("status") == "error"
          assert data.get("schema_version") == "0.1"
          # Research mode enabled and preflight structure
          rm = data.get("research_mode", {})
          assert rm.get("enabled") is True
          assert rm.get("preset_version") == "0.1"
          em = rm.get("expanded_defaults", {})
          assert em.get("provider") == "auto"
          assert em.get("json") is True
          assert em.get("compact") is True
          assert em.get("profile") == "official-docs"
          ef = rm.get("effective_values", {})
          assert ef.get("json") is True
          assert ef.get("compact") is True
          # effective_values.profile is user-provided (may be invalid)
          assert data.get("recovery", {}).get("websearch_allowed") is False
          # Invalid profile reported honestly
          failures = data.get("failures") or []
          assert failures, "expected non-empty failures list"
          assert "unknown profile" in failures[0].get("reason", "")
          PY
