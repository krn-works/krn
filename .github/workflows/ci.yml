name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64","krn-ci-isolated"]') }}
    env:
      KRN_LIVE: ''
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Check isolation test capabilities
        run: |
          set -uo pipefail
          capability_failure=0

          echo 'Checking bwrap network and PID namespace, mount, and execution capabilities'
          if bwrap --die-with-parent --ro-bind / / --clearenv --unshare-net --unshare-pid --as-pid-1 --tmpfs /tmp --setenv HOME /tmp --setenv TMPDIR /tmp --setenv PATH /usr/bin:/bin --proc /proc --dev /dev -- /usr/bin/true; then
            echo 'bwrap capability check passed'
          else
            status=$?
            echo "::error::bwrap capability check failed with exit code ${status}"
            capability_failure=1
          fi

          echo 'Checking systemd user manager capability'
          if systemctl --user show-environment >/dev/null; then
            echo 'systemd user manager check passed'
          else
            status=$?
            echo "::error::systemd user manager check failed with exit code ${status}"
            capability_failure=1
          fi

          echo 'Checking systemd transient user scope capability'
          if systemd-run --user --scope --wait --quiet /usr/bin/true; then
            echo 'systemd transient user scope check passed'
          else
            status=$?
            echo "::error::systemd transient user scope check failed with exit code ${status}"
            capability_failure=1
          fi

          if [ "$capability_failure" -ne 0 ]; then
            exit 1
          fi
          echo 'Isolation capability check passed: bwrap and systemd user scope are available'

      - name: Enable pnpm through Corepack
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run gate
        run: npm run gate
