name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: gate
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64","krn-ci-isolated"]') }}
    env:
      KRN_LIVE: ''
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - name: Enable pnpm through Corepack
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up mise outside the isolated fleet
        if: ${{ !contains(format(',{0},', join(fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64","krn-ci-isolated"]'), ',')), ',krn-ci-isolated,') }}
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          version: 2026.10.17
          install: false
          cache: false

      - name: Prepare isolation outside the isolated fleet
        if: ${{ !contains(format(',{0},', join(fromJSON(vars.CI_RUNNER || '["self-hosted","linux","x64","krn-ci-isolated"]'), ',')), ',krn-ci-isolated,') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          manager="$(node -p "require('./package.json').packageManager")"
          mise install "$manager"

      - name: Run gate
        run: npm run gate
