name: Set up KRN CI
description: Install the pinned Node.js, pnpm dependencies with a store cache, and optionally user-namespace isolation for the sandbox tests.
inputs:
  isolation:
    description: Enable unprivileged user namespaces and install bubblewrap for the sandbox tests.
    default: 'false'
  codex:
    description: Install the codex binary pinned in spec/worker-scope.json for the receiver tests.
    default: 'false'
runs:
  using: composite
  steps:
    # bubblewrap installs in the background from the first step, overlapping the
    # pnpm cache restore and install, and is awaited before the tests start.
    - name: Start installing bubblewrap for sandbox isolation tests
      if: ${{ inputs.isolation == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/bubblewrap-install.log"
        status="$RUNNER_TEMP/bubblewrap-install.status"
        rm -f "$status"
        setsid nohup bash -c '
          for attempt in 1 2 3; do
            if timeout 90 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y -qq bubblewrap \
              || { timeout 60 sudo apt-get -o Acquire::http::Timeout=20 update -qq && timeout 90 sudo apt-get install -y -qq bubblewrap; }; then
              echo 0 > "$1"; exit 0
            fi
          done
          echo 1 > "$1"
        ' _ "$status" > "$log" 2>&1 < /dev/null &

    # The pinned codex binary comes from the npm registry, which checks the
    # tarball integrity, never from a github.com release download; it
    # downloads in the background and is awaited before the tests start.
    - name: Start installing the pinned codex binary
      if: ${{ inputs.codex == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        version="$(node -p 'require("./spec/worker-scope.json").supportedVersions[0]')"
        dir="$RUNNER_TEMP/codex"
        mkdir -p "$dir/bin"
        rm -f "$dir/status"
        echo "$dir/bin" >> "$GITHUB_PATH"
        setsid nohup bash -c '
          cd "$1"
          for attempt in 1 2 3; do
            if timeout 120 npm pack --silent "@openai/codex@$2-linux-x64" > pack.name \
              && tar -xzf "$(cat pack.name)" --strip-components=4 -C bin package/vendor/x86_64-unknown-linux-musl/bin/codex; then
              rm -f "$(cat pack.name)"; echo 0 > status; exit 0
            fi
          done
          echo 1 > status
        ' _ "$dir" "$version" > "$dir/install.log" 2>&1 < /dev/null &

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    - name: Enable pnpm through Corepack
      shell: bash
      run: |
        set -euo pipefail
        corepack enable
        pnpm --version
        store="$(pnpm store path --silent)"
        echo "PNPM_STORE_PATH=$store" >> "$GITHUB_ENV"
        # The test suite hands this store to every shard worker. Setting it here
        # keeps the shards off `mise where pnpm`, whose pnpm and mise downloads
        # come from github.com releases and fail every shard during an outage.
        echo "pnpm_config_store_dir=$store" >> "$GITHUB_ENV"

    - name: Cache the pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Allow unprivileged user namespaces for isolation tests
      if: ${{ inputs.isolation == 'true' }}
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Wait for bubblewrap
      if: ${{ inputs.isolation == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        status="$RUNNER_TEMP/bubblewrap-install.status"
        for _ in $(seq 1 300); do
          test -f "$status" && break
          sleep 0.5
        done
        if [ "$(cat "$status" 2>/dev/null || echo 1)" != 0 ]; then
          cat "$RUNNER_TEMP/bubblewrap-install.log" >&2
          echo 'bubblewrap install failed' >&2
          exit 1
        fi
        bwrap --version

    - name: Wait for codex
      if: ${{ inputs.codex == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/codex"
        for _ in $(seq 1 600); do
          test -f "$dir/status" && break
          sleep 0.5
        done
        if [ "$(cat "$dir/status" 2>/dev/null || echo 1)" != 0 ]; then
          cat "$dir/install.log" >&2
          echo 'codex install failed' >&2
          exit 1
        fi
        codex --version
