name: Set up KRN CI
description: Install the pinned Node.js, pnpm dependencies with a store cache, and optionally user-namespace isolation for the sandbox tests.
inputs:
  isolation:
    description: Enable unprivileged user namespaces and install bubblewrap for the sandbox tests.
    default: 'false'
runs:
  using: composite
  steps:
    # The runner image has no bubblewrap and its apt mirror has stalled whole
    # runs, so the .deb is cached and installed with dpkg when present.
    - name: Cache the bubblewrap package
      if: ${{ inputs.isolation == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/bubblewrap-debs
        key: bubblewrap-deb-${{ runner.os }}-${{ runner.arch }}-v1

    # bubblewrap installs in the background, overlapping the pnpm cache restore
    # and install, and is awaited before the tests start.
    - name: Start installing bubblewrap for sandbox isolation tests
      if: ${{ inputs.isolation == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        log="$RUNNER_TEMP/bubblewrap-install.log"
        status="$RUNNER_TEMP/bubblewrap-install.status"
        debs="$RUNNER_TEMP/bubblewrap-debs"
        rm -f "$status"
        mkdir -p "$debs"
        # Worst case 60 s release fetch + 3 x (60 + 60 + 60) s + 15 s of pauses
        # = 615 s; the waiter below polls for 650 s so it never gives up first.
        setsid nohup bash -c '
          if command -v bwrap > /dev/null; then echo 0 > "$1"; exit 0; fi
          if compgen -G "$2/bubblewrap_*.deb" > /dev/null \
            && sudo dpkg -i "$2"/bubblewrap_*.deb; then
            echo 0 > "$1"; exit 0
          fi
          # Every Ubuntu archive host has been unresolvable from the runners for
          # whole runs, so the pinned .deb (sha256 from the noble-updates index)
          # comes from this repository's ci-deps release first.
          deb="$2/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb"
          if timeout 60 curl -fsSL --retry 3 -o "$deb" \
              https://github.com/krn-works/krn/releases/download/ci-deps/bubblewrap_0.9.0-1ubuntu0.3_amd64.deb \
            && echo "2461f1beee9cb04c8942739fe1a2b37e7b7c2a3d518f0779dc75f9245baa3094  $deb" | sha256sum -c - \
            && sudo dpkg -i "$deb"; then
            echo 0 > "$1"; exit 0
          fi
          rm -f "$deb"
          for attempt in 1 2 3; do
            if timeout 60 sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y bubblewrap \
              || { timeout 60 sudo apt-get -o Acquire::http::Timeout=20 update && timeout 60 sudo apt-get install -y bubblewrap; }; then
              cp /var/cache/apt/archives/bubblewrap_*.deb "$2"/ || true
              echo 0 > "$1"; exit 0
            fi
            # The Azure mirror behind apt-mirrors.txt has been unreachable for
            # whole runs; later attempts read the canonical archive instead.
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null || true
            sleep $((attempt * 5))
          done
          echo 1 > "$1"
        ' _ "$status" "$debs" > "$log" 2>&1 < /dev/null &

    # setup-node looks in RUNNER_TOOL_CACHE before downloading; restoring the
    # pinned version there (with its x64.complete marker) skips the download.
    - name: Read the pinned Node.js version
      id: node-version
      shell: bash
      run: echo "version=$(tr -d '[:space:]v' < .node-version)" >> "$GITHUB_OUTPUT"

    - name: Cache the pinned Node.js toolchain
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/node/${{ steps.node-version.outputs.version }}
        key: node-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.version }}

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    # krn eval check resolves Node only from a mise install
    # (MISE_DATA_DIR/installs/node/<version>/bin); copy setup-node's toolchain
    # into that layout so the sandbox tests reach the production path.
    - name: Expose the pinned Node.js as a mise install for sandbox tests
      if: ${{ inputs.isolation == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        data="$RUNNER_TEMP/mise"
        version="$(node -p process.versions.node)"
        mkdir -p "$data/installs/node"
        cp -a "$(dirname "$(dirname "$(command -v node)")")" "$data/installs/node/$version"
        echo "MISE_DATA_DIR=$data" >> "$GITHUB_ENV"

    - name: Enable pnpm through Corepack
      shell: bash
      run: |
        set -euo pipefail
        corepack enable
        pnpm --version
        store="$(pnpm store path --silent)"
        echo "PNPM_STORE_PATH=$store" >> "$GITHUB_ENV"
        # The test suite hands this store to every shard worker. Setting it here
        # keeps the shards off `mise where pnpm`, whose pnpm and mise downloads
        # come from github.com releases and fail every shard during an outage.
        echo "pnpm_config_store_dir=$store" >> "$GITHUB_ENV"

    - name: Cache the pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Allow unprivileged user namespaces for isolation tests
      if: ${{ inputs.isolation == 'true' }}
      shell: bash
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

    - name: Wait for bubblewrap
      if: ${{ inputs.isolation == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        status="$RUNNER_TEMP/bubblewrap-install.status"
        for _ in $(seq 1 1300); do
          test -f "$status" && break
          sleep 0.5
        done
        if [ "$(cat "$status" 2>/dev/null || echo 1)" != 0 ]; then
          cat "$RUNNER_TEMP/bubblewrap-install.log" >&2
          echo 'bubblewrap install failed' >&2
          exit 1
        fi
        bwrap --version
